<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Koch24 Детейлинг центр</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id='app' class='app'>
        <!-- Шапка -->
        <div id='header' class='header'>
            <div id='name' class='name'>Детейлинг центр Koch24</div>
            <div id='number' class='number'>
                <a href="tel:+74952286428">+7 (495) 228-64-28</a>
            </div>
        </div>

        <!-- Логотип -->
        <div id='logo' class='logo'>
            <img src="logo.png" alt="Логотип Koch24" class="logo-image">
        </div>

        <!-- Услуги -->
        <div id='group1' class='group1'>
            <div id='heading2→услугидетейлингцентра' class='heading2→услугидетейлингцентра'>
                Услуги детейлинг центра
            </div>
            <div class='services-grid'>
                <!-- Услуги остаются без изменений -->
            </div>
        </div>

        <!-- Заголовок и описание -->
        <div id='content' class='content'>
            <div id='heading2→детейлингцентрвмоскве' class='heading2→детейлингцентрвмоскве'>
                Детейлинг центр в Москве
            </div>
            <div id='about' class='about'>
                <!-- Описание остается без изменений -->
            </div>
        </div>

        <!-- Кнопка "Записаться сейчас" -->
        <div id="fixed-button" class="fixed-button">
            Записаться сейчас
        </div>

        <!-- Модальное окно -->
        <div id="modal" class="modal">
            <div class="modal-content">
                <!-- Крестик для закрытия модального окна -->
                <div class="close-modal" onclick="closeModal()">×</div>

                <!-- Шаг 1: Выбор марки и модели -->
                <div id="step1" class="step">
                    <h2>Выберите марку и модель автомобиля</h2>
                    <select id="brand" onchange="populateModels()">
                        <option value="">Выберите марку</option>
                    </select>
                    <select id="model" disabled>
                        <option value="">Выберите модель</option>
                    </select>
                    <button id="next1" disabled onclick="nextStep(2)">Подтвердить</button>
                </div>

                <!-- Шаг 2: Выбор услуг -->
                <div id="step2" class="step" style="display: none;">
                    <h2>Выберите услуги</h2>
                    <div id="services-container"></div>
                    <p>Подытог: <span id="total">0₽</span></p>
                    <button id="next2" disabled onclick="nextStep(3)">Подтвердить</button>
                </div>

                <!-- Шаг 3: Выбор даты и времени -->
                <div id="step3" class="step" style="display: none;">
                    <h2>Выберите дату и время</h2>

                    <!-- Блок выбора даты -->
                    <!-- Внутри модального окна, в блоке выбора даты -->
<div id="date-picker">
    <div id="selected-date">
        <button id="prev-day" onclick="changeDay(-1)">‹</button>
        <div id="date-display" onclick="toggleCalendar()">
            <span id="current-date">Сегодня</span>
            <span id="current-day"></span>
        </div>
        <button id="next-day" onclick="changeDay(1)">›</button>
    </div>
    <div id="calendar" style="display: none;">
        <div class="calendar-header">
            <button onclick="changeMonth(-1)">‹</button>
            <span id="current-month"></span>
            <button onclick="changeMonth(1)">›</button>
        </div>
        <div class="calendar-days">
            <div>Пн</div>
            <div>Вт</div>
            <div>Ср</div>
            <div>Чт</div>
            <div>Пт</div>
            <div>Сб</div>
            <div>Вс</div>
        </div>
        <div id="calendar-grid"></div>
    </div>
</div>

                    <!-- Блок выбора времени -->
                    <div class="time-slots"></div>
                    <button id="next3" disabled onclick="nextStep(4)">Подтвердить</button>
                </div>

                <!-- Шаг 4: Ввод данных -->
                <div id="step4" class="step" style="display: none;">
                    <h2>Введите ваши данные</h2>
                    <input type="text" id="clientName" placeholder="ФИО" oninput="validateName(this)">
                    <input type="tel" id="clientPhone" placeholder="Номер телефона" oninput="formatPhone(this)">
                    <input type="text" id="clientCarNumber" placeholder="Номер авто">
                    <button id="next4" disabled onclick="nextStep(5)">Подтвердить</button>
                </div>

                <!-- Шаг 5: Успешная запись -->
                <div id="step5" class="step" style="display: none;">
                    <h2>Вы успешно записались!</h2>
                    <button onclick="closeModal()">Закрыть</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Подключение JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script src="database.js"></script>
    <script src="script.js"></script>
</body>
</html>
